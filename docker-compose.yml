version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: artbid-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: artbid-hub
    volumes:
      - mongodb_data:/data/db
    networks:
      - artbid-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artbid-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/artbid-hub?authSource=admin
      - JWT_SECRET=dev-secret-key-change-in-production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - artbid-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artbid-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - artbid-network

volumes:
  mongodb_data:

networks:
  artbid-network:
    driver: bridge
